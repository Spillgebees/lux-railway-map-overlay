# More than one replica works with the default baked-in MBTiles. With a
# ReadWriteOnce volume (persistence.enabled), keep one replica.
replicaCount: 1

image:
  repository: ghcr.io/spillgebees/lux-railway-map-overlay
  # Defaults to the chart appVersion. The published chart sets appVersion to
  # its release version, which is also an image tag.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automount: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: tiles.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  certManager:
    enabled: false
    clusterIssuer: ""
    issuer: ""
    issuerKind: ""
    issuerGroup: ""
    addDefaultTls: true

# External base URL written into style.json. If empty, derived from the first
# ingress host (https:// when the ingress has TLS), else http://localhost:3000.
publicUrl: ""

env: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi

deploymentStrategy:
  # Recreate or RollingUpdate. Empty picks Recreate when persistence is
  # enabled and RollingUpdate otherwise.
  type: ""

revisionHistoryLimit: 2

# The published image contains the MBTiles. Enable persistence only to serve
# your own file from a volume mounted at /data, and set
# env.MBTILES_PATH=/data/lux-railway-map-overlay.mbtiles, because the baked-in
# file takes precedence.
persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  annotations: {}
  readOnly: true

tmpVolume:
  enabled: true
  sizeLimit: 64Mi

probes:
  startup:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

networkPolicy:
  enabled: true

# With replicaCount 1 and minAvailable 1, the budget blocks node drains.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
