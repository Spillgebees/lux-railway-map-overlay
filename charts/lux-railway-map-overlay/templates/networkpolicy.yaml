{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lux-railway-map-overlay.fullname" . }}
  labels:
    {{- include "lux-railway-map-overlay.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lux-railway-map-overlay.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    {{- if and .Values.metrics.enabled .Values.metrics.networkPolicy.from }}
    - from:
        {{- toYaml .Values.metrics.networkPolicy.from | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ include "lux-railway-map-overlay.metricsPort" . }}
    {{- end }}
  egress: []
{{- end }}
