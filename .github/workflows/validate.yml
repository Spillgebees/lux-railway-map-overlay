name: Validate

permissions: {}

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

env:
  # renovate: datasource=npm depName=@maplibre/maplibre-gl-style-spec
  STYLE_SPEC_VERSION: 26.4.4
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.0
  # renovate: datasource=docker depName=koalaman/shellcheck
  SHELLCHECK_VERSION: v0.11.0

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter lists PR files through the API

    # workflow_dispatch runs every check
    outputs:
      workflows: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.workflows == 'true' }}
      python: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.python == 'true' }}
      viewer: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.viewer == 'true' }}
      docker: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docker == 'true' }}
      style: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.style == 'true' }}
      biome: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.biome == 'true' }}
      helm: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.helm == 'true' }}
      shell: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.shell == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check for changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
            python:
              - 'scripts/**'
              - 'tests/**'
              - 'pyproject.toml'
              - '.github/workflows/validate.yml'
            viewer:
              - 'viewer/**'
              - '.config/dotnet-tools.json'
              - '.editorconfig'
              - '.github/workflows/validate.yml'
            docker:
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'scripts/**'
              - 'styles/**'
              - 'tiles/**'
              - '.github/workflows/validate.yml'
              - '.github/workflows/publish-image.yml'
            style:
              - 'styles/**'
              - '.github/workflows/validate.yml'
            biome:
              - 'biome.json'
              - '**/*.json'
              - '**/*.jsonc'
              - '**/*.css'
              - '**/*.js'
              - '**/*.ts'
              - '.github/workflows/validate.yml'
            helm:
              - 'charts/**'
              - '.github/workflows/validate.yml'
            shell:
              - '**/*.sh'
              - '.github/workflows/validate.yml'

  github-actions:
    name: GitHub Actions Validation
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint workflow files
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  python:
    name: Python Formatting and Tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONPATH: scripts

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check formatting
        run: black --check scripts tests

      - name: Run unit tests
        run: pytest

  viewer:
    name: Viewer Build and Formatting
    needs: changes
    if: needs.changes.outputs.viewer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Check C# formatting
        run: dotnet csharpier check viewer

      - name: Build viewer
        run: dotnet build viewer/RailwayViewer.slnx --configuration Release -warnaserror

  docker:
    name: Dockerfile Build Validation
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Compose file
        run: docker compose --profile generate config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build generator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./scripts
          file: ./scripts/Dockerfile
          push: false
          load: false
          # mode=max caches the tippecanoe builder stage too
          cache-from: type=gha,scope=generator
          cache-to: type=gha,scope=generator,mode=max

      - name: Build tiles image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./tiles/Dockerfile
          target: runtime
          push: false
          load: false
          # mode=max caches the font-maker glyphs stage too
          cache-from: type=gha,scope=tiles
          cache-to: type=gha,scope=tiles,mode=max

  style:
    name: MapLibre Style Validation
    needs: changes
    if: needs.changes.outputs.style == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Validate style.json against the MapLibre style spec
        run: npx --yes --package "@maplibre/maplibre-gl-style-spec@${STYLE_SPEC_VERSION}" gl-style-validate styles/style.json

  biome:
    name: Biome Check
    needs: changes
    if: needs.changes.outputs.biome == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      # Use the Biome version from the biome.json $schema URL, which Renovate keeps current.
      - name: Run Biome
        run: |
          version="$(jq -r '."$schema"' biome.json | sed -E 's#^.*/schemas/([^/]+)/schema\.json$#\1#')"
          echo "Using Biome ${version}"
          npx --yes "@biomejs/biome@${version}" ci .

  helm:
    name: Helm Chart Validation
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CHART: charts/lux-railway-map-overlay

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ env.HELM_VERSION }}

      # Default values plus every ci/*-values.yaml scenario (ingress with TLS, cert-manager).
      - name: Lint and render chart
        run: |
          mkdir -p rendered
          helm lint --strict "$CHART"
          helm template ci "$CHART" > rendered/default.yaml
          for values in "$CHART"/ci/*-values.yaml; do
            name="$(basename "$values" -values.yaml)"
            helm lint --strict "$CHART" --values "$values"
            helm template ci "$CHART" --values "$values" > "rendered/${name}.yaml"
          done

      - name: Validate rendered manifests
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
        with:
          args: -strict -summary rendered

  shell:
    name: ShellCheck
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run ShellCheck on tracked shell scripts
        run: |
          git ls-files -z '*.sh' \
            | xargs -0 --no-run-if-empty docker run --rm \
              -v "$GITHUB_WORKSPACE:/mnt" -w /mnt \
              "koalaman/shellcheck:${SHELLCHECK_VERSION}"

  # Single required status check. Skipped jobs count as passed.
  validate:
    name: Validate
    needs:
      - changes
      - github-actions
      - python
      - viewer
      - docker
      - style
      - biome
      - helm
      - shell
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Check job results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "::error::One or more validation jobs failed or were cancelled."
            exit 1
          fi
          echo "All validation jobs passed or were skipped."
