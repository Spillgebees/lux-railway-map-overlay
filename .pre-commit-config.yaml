repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        files: ^(scripts|tests)/

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker

  # keep rev in step with the biome.json $schema version (CI reads it from there)
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.15
    hooks:
      - id: biome-check

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: dotnet-tool-restore
        name: Restore .NET tools
        entry: dotnet tool restore
        language: system
        pass_filenames: false
        always_run: true

      - id: csharpier
        name: Run CSharpier
        entry: dotnet tool run csharpier format
        language: system
        files: ^viewer/.*\.(cs|csproj|props|targets|xml)$
        require_serial: true
