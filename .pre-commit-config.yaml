repos:
  # keep rev in step with the ruff pin in pyproject.toml's dev group
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker

  # keep rev in step with the biome.json $schema version (CI reads it from there)
  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.15
    hooks:
      - id: biome-check

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      # runs from the project venv so it sees the locked shapely and stubs
      - id: basedpyright
        name: Type-check Python with basedpyright
        entry: uv run --locked basedpyright
        language: system
        types: [python]
        pass_filenames: false

      - id: dotnet-tool-restore
        name: Restore .NET tools
        entry: dotnet tool restore
        language: system
        pass_filenames: false
        always_run: true

      - id: csharpier
        name: Run CSharpier
        entry: dotnet tool run csharpier format
        language: system
        files: ^viewer/.*\.(cs|csproj|props|targets|xml)$
        require_serial: true
