[project]
name = "lux-railway-map-overlay"
version = "0.1.0"
description = "Railway infrastructure vector tile generator for Luxembourg"
requires-python = ">=3.14"
dependencies = [
    "shapely>=2.0,<3",
]

[dependency-groups]
dev = [
    "basedpyright==1.40.1",
    "pre-commit",
    "pytest",
    "ruff==0.16.10",
    "types-shapely>=2.1.0.20260728",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "generator"
module-root = "scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
]
ignore = [
    # the formatter owns line length; the remaining long lines are strings
    "E501",
]
# route names use en dashes as separators (route_naming.build_variant_signature)
allowed-confusables = ["–"]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["scripts", "tests"]
extraPaths = ["scripts"]
