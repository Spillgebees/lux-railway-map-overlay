[project]
name = "lux-railway-map-overlay"
version = "0.1.0"
description = "Railway infrastructure vector tile generator for Luxembourg"
requires-python = ">=3.14"
dependencies = [
    "shapely>=2.0,<3",
]

[dependency-groups]
dev = [
    "black",
    "pre-commit",
    "pytest",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "generator"
module-root = "scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.black]
target-version = ["py314"]
